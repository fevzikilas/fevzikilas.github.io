<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=3.0">
    <title>💀⛩️💮🎉♾️👀</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <!-- Add STL Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/STLLoader.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            background-color: #000;
            color: #fff;
            height: 1600vh; /* Height for all sections */
            cursor: pointer;

        }
        
        ::-webkit-scrollbar {
            width: 0;
            height: 0;
            background: transparent;
            display: none;
            }
        
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        #landing {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .title {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .subtitle {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            text-align: center;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        
        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0) translateX(-50%);
            }
            40% {
                transform: translateY(-30px) translateX(-50%);
            }
            60% {
                transform: translateY(-15px) translateX(-50%);
            }
        }
        
        .link-section {
            height: 100vh;
            position: relative;
        }
        
        #link-name {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, 150px);
            font-size: 1.8rem;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
            pointer-events: none;
        }
        
        /* Copyright notice style */
        .copyright {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 0.3rem;
            color: rgba(255, 255, 255, 0.4);
            z-index: 100;
            pointer-events: none;
            font-family: 'Arial', sans-serif;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <section id="landing">
        <h1 class="title">Fevzi KILAS</h1>
        <p class="subtitle">ML Engineer</p>
        <div class="scroll-indicator">↓</div>
    </section>
    
    <!-- Info about current 3D object link -->
    <div id="link-name"></div>
    
    <!-- Copyright notice -->
    <div class="copyright">© 2025 All Rights Reserved</div>
    
    <script>
        // Update the links array with model information
        const links = [
            { url: "https://fevzikilas.github.io/blog-agent", text: "♾️ Agentic Blogs ♾️", model: "agentic-blog.stl" },
            { url: "https://fevzikilas.github.io/flashcards", text: "⛩️ Flashcards ⛩️", model: "flashcard.stl" },
            { url: "https://fevzikilas.github.io/neurapath", text: "💮 Neura Path 💮", model: "neuropath.stl" },
            { url: "https://fevzikilas.github.io/MDLP", text: "MDLP 🌛", model: "mdlp.stl" },
            { url: "https://fevzikilas.github.io/FON", text: "Focus 🤗", model: "focus.stl" },
            { url: "https://fevzikilas.github.io/NOTES", text: "MY NOTES 😊", model: "mynotes.stl" },
            { url: "https://fevzikilas.github.io/TSFM", text: "TSF Models", model: "tsf.stl" },
            { url: "https://fevzikilas.github.io/TSF", text: "Time Series & More", model: "tsandmore.stl" },
            { url: "https://fevzikilas.github.io/Pothole_detection", text: "Pothole Detection", model: "pothole.stl" },
            { url: "https://fevzikilas.github.io/LLM_first_notebook", text: "General LLM works", model: "genllm.stl" },
            { url: "https://fevzikilas.github.io/LLM_Tarim", text: "TARIM LLM", model: "tarimllm.stl" },
            { url: "https://fevzikilas.github.io/classification", text: "Classification", model: "classification.stl" },
            { url: "https://fevzikilas.github.io/BlobCapture", text: "Blob Capture", model: "blob.stl" },
            { url: "https://fevzikilas.github.io/Prototune_data_preparation", text: "Prototune", model: "prottotune.stl" },
            { url: "https://loncam.github.io/", text: "Lonca", model: "lonca.stl" },
            { url: "https://fevzikilas.github.io/skin_cancer_model_ISIC2016", text: "Skin Cancer Classification", model: "skincancer.stl" }
        ];
        
        // Create link sections (just for scroll purposes)
        links.forEach((link, index) => {
            const section = document.createElement('section');
            section.className = 'link-section';
            section.id = `link-section-${index}`;
            document.body.appendChild(section);
        });
        
        // Start fresh - define all animation variables up front
        let currentIndex = -1;
        let scrollY = window.scrollY;
        let prevScrollY = scrollY;
        let scrollDirection = 0; // 0: none, 1: down, -1: up
        let targetIndex = -1;
        let scrollProgress = 0;
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        
        // Setup Three.js
        const canvas = document.getElementById('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        
        // Setup raycaster for object interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredObject = null;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(2, 2, 5);
        scene.add(directionalLight);
        
        // Create an object to store loaded models by filename
        const loadedModels = {};

        // Function to load an STL model and create a mesh
        function loadSTLModel(filename, index, callback) {
            const stlLoader = new THREE.STLLoader();
            stlLoader.load(filename, function(geometry) {
                console.log(`STL ${filename} loaded - starting processing`);
                try {
                    // Make sure normals are computed properly
                    geometry.computeVertexNormals();
                    
                    // Center the geometry
                    geometry.center();
                    
                    // Compute the bounding box to adjust scale appropriately
                    geometry.computeBoundingBox();
                    const size = new THREE.Vector3();
                    geometry.boundingBox.getSize(size);
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 1.0 / maxDim;  // Scale to fit a unit cube
                    
                    // Apply scaling based on actual model dimensions
                    geometry.scale(scale, scale, scale);
                    
                    console.log(`STL model ${filename} processed - details:`, 
                                'Vertices:', geometry.attributes.position.count,
                                'Size:', size);
                    
                    // Store the processed geometry
                    loadedModels[filename] = geometry;
                    
                    if (callback) callback(geometry, index);
                } catch (e) {
                    console.error(`Error processing STL ${filename}:`, e);
                    // Use a fallback geometry in case of error
                    if (callback) callback(null, index);
                }
            }, 
            // Progress callback
            function(xhr) {
                console.log(filename + ': ' + (xhr.loaded / xhr.total * 100) + '% loaded');
            }, 
            // Error callback
            function(error) {
                console.error('Failed to load STL:', filename, error);
                // Use a fallback geometry in case of error
                if (callback) callback(null, index);
            });
        }

        // Modified code to create objects with STL models
        function createObjectForLink(link, index) {
            // Create material based on the object index
            const material = new THREE.MeshStandardMaterial({
                color: colors[index % colors.length],
                metalness: 0.4,
                roughness: 0.3,
                emissive: 0x222222,
                side: THREE.DoubleSide,
                flatShading: false
            });
            
            // If the model is already loaded, use it
            let geometry;
            if (loadedModels[link.model]) {
                geometry = loadedModels[link.model];
            } else {
                // If model isn't loaded, create a simple sphere as placeholder
                geometry = new THREE.SphereGeometry(1, 16, 16);
                console.warn(`Model ${link.model} not loaded, using placeholder.`);
            }
            
            // Create the mesh
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, -50, 0); // Start out of view
            mesh.scale.set(0, 0, 0); // Start with no scale
            mesh.userData = {
                initialRotation: {
                    x: 0,
                    y: 0,
                    z: 0
                },
                // Removed auto rotation properties
                linkIndex: index,
                url: link.url,
                text: link.text,
                model: link.model,
                isLink: true,
                isAnimating: false,
                isStlModel: true
            };
            
            mesh.rotation.x = mesh.userData.initialRotation.x;
            mesh.rotation.y = mesh.userData.initialRotation.y;
            mesh.rotation.z = mesh.userData.initialRotation.z;
            mesh.visible = false;
            
            scene.add(mesh);
            objects[index] = mesh;
            
            console.log(`Created object for link ${index}: ${link.text} with model ${link.model}`);
        }

        // Add water ripple effect
        const rippleCanvas = document.createElement('canvas');
        const rippleCtx = rippleCanvas.getContext('2d');
        const ripples = [];
        
        // Setup ripple canvas
        function setupRippleEffect() {
            rippleCanvas.width = window.innerWidth;
            rippleCanvas.height = window.innerHeight;
            rippleCanvas.style.position = 'fixed';
            rippleCanvas.style.top = '0';
            rippleCanvas.style.left = '0';
            rippleCanvas.style.pointerEvents = 'none';
            rippleCanvas.style.zIndex = '100';
            rippleCanvas.style.opacity = '0.7';
            document.body.appendChild(rippleCanvas);
        }
        
        // Create a ripple at mouse position
        function createRipple(x, y) {
            ripples.push({
                x,
                y,
                radius: 5,
                maxRadius: 40,
                opacity: 0.5,
                color: `rgba(255, 255, 255, 0.7)`
            });
        }
        
        // Draw ripples
        function drawRipples() {
            rippleCtx.clearRect(0, 0, rippleCanvas.width, rippleCanvas.height);
            
            for (let i = 0; i < ripples.length; i++) {
                const ripple = ripples[i];
                
                // Draw ripple
                rippleCtx.beginPath();
                rippleCtx.strokeStyle = ripple.color;
                rippleCtx.lineWidth = 2;
                rippleCtx.globalAlpha = ripple.opacity;
                rippleCtx.arc(ripple.x, ripple.y, ripple.radius, 0, Math.PI * 2);
                rippleCtx.stroke();
                
                // Update ripple
                ripple.radius += 1.5;
                ripple.opacity -= 0.02;
                
                // Remove ripple if it's too big or too transparent
                if (ripple.radius > ripple.maxRadius || ripple.opacity <= 0) {
                    ripples.splice(i, 1);
                    i--;
                }
            }
        }

        // Add more lighting to better illuminate the model
        const hemisphereLight = new THREE.HemisphereLight(0xffffbb, 0x080820, 1);
        scene.add(hemisphereLight);
        
        // Add a point light that follows the camera
        const pointLight = new THREE.PointLight(0xffffff, 1, 100);
        pointLight.position.set(0, 0, 5);
        camera.add(pointLight);
        scene.add(camera);
        
        // Colors for the objects - vibrant colors for STL models
        const colors = [
            0x3357FF, // First color for first STL model
            0xFF5733, 0x33FF57, 0xF3FF33, 
            0xFF33F3, 0x33FFF3, 0xF333FF, 0x33F3FF,
            0xF3F333, 0xF33F33, 0x3F33F3, 0x33F3F3,
            0xF33333, 0x33F333, 0x3333F3, 0xFFFFFF
        ];
        
        // Create objects array with placeholders
        const objects = new Array(links.length).fill(null);
        
        // Initialize objects with empty placeholder first
        links.forEach((link, index) => {
            // Create a placeholder sphere until the STL is loaded
            const geometry = new THREE.SphereGeometry(1, 16, 16);
            const material = new THREE.MeshPhongMaterial({
                color: colors[index % colors.length],
                shininess: 100,
                specular: 0x444444,
                transparent: true, 
                opacity: 0.5
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, -50, 0);
            mesh.scale.set(0, 0, 0);
            mesh.userData = {
                initialRotation: {
                    x: 0,
                    y: 0,
                    z: 0
                },
                linkIndex: index,
                url: link.url,
                text: link.text,
                model: link.model,
                isLink: true,
                isAnimating: false
            };
            
            mesh.rotation.x = mesh.userData.initialRotation.x;
            mesh.rotation.y = mesh.userData.initialRotation.y;
            mesh.rotation.z = mesh.userData.initialRotation.z;
            mesh.visible = false;
            
            scene.add(mesh);
            objects[index] = mesh;
        });
        
        // Start loading all STL models
        links.forEach((link, index) => {
            loadSTLModel(link.model, index, function(geometry, idx) {
                if (geometry) {
                    // Once the model is loaded, update or create the object
                    createObjectForLink(links[idx], idx);
                    
                    // If this is the current visible object, refresh it
                    if (currentIndex === idx) {
                        showObject(idx);
                    }
                }
            });
        });

        // Add particles to the background
        const particlesCount = 2000;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesPositions = new Float32Array(particlesCount * 3);
        
        for (let i = 0; i < particlesCount * 3; i++) {
            particlesPositions[i] = (Math.random() - 0.5) * 20;
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.05,
            transparent: true,
            opacity: 0.7
        });
        
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);
        
        // Link name display element
        const linkNameElement = document.getElementById('link-name');
        
        // Simple animation function
        function animateObject(obj, targetScale, targetY, duration, callback) {
            // Cancel any existing animation
            if (obj.userData.animationFrameId) {
                cancelAnimationFrame(obj.userData.animationFrameId);
            }
            
            const startTime = performance.now();
            const startScale = { x: obj.scale.x, y: obj.scale.y, z: obj.scale.z };
            const startY = obj.position.y;
            
            obj.userData.isAnimating = true;
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3); // Cubic ease out
                
                // Update scale
                obj.scale.x = startScale.x + (targetScale - startScale.x) * ease;
                obj.scale.y = startScale.y + (targetScale - startScale.y) * ease;
                obj.scale.z = startScale.z + (targetScale - startScale.z) * ease;
                
                // Update position
                obj.position.y = startY + (targetY - startY) * ease;
                
                if (progress < 1) {
                    obj.userData.animationFrameId = requestAnimationFrame(animate);
                } else {
                    obj.userData.isAnimating = false;
                    if (callback) callback();
                }
            }
            
            obj.userData.animationFrameId = requestAnimationFrame(animate);
        }
        
        // Show a specific object with smooth transition - Increased scale for STL models
        function showObject(index) {
            if (index < 0 || index >= objects.length) return;
            
            // Hide current object if any
            if (currentIndex >= 0 && currentIndex < objects.length && currentIndex !== index) {
                const prevObj = objects[currentIndex];
                prevObj.visible = true;
                
                // Different animation based on scroll direction
                if (scrollDirection > 0) {
                    // Moving down - current object moves up
                    animateObject(prevObj, 0.5, 5, 800, () => {
                        prevObj.visible = false;
                    });
                } else {
                    // Moving up - current object moves down
                    animateObject(prevObj, 0.5, -5, 800, () => {
                        prevObj.visible = false;
                    });
                }
            }
            
            // Show new object
            const obj = objects[index];
            obj.visible = true;
            
            // Larger scale for all STL models
            const targetScale = 5.5;  // Increased size from 2 to 3.5
            
            if (scrollDirection > 0) {
                // Coming from below
                obj.position.y = -5;
                obj.scale.set(targetScale * 0.5, targetScale * 0.5, targetScale * 0.5);
            } else {
                // Coming from above
                obj.position.y = 5;
                obj.scale.set(targetScale * 0.5, targetScale * 0.5, targetScale * 0.5);
            }
            
            // Animate to center with appropriate scale
            animateObject(obj, targetScale, 0, 800);
            
            currentIndex = index;
        }
        
        // Smooth scroll handling
        function updateScrollProgress() {
            const windowHeight = window.innerHeight;
            const totalHeight = document.body.scrollHeight;
            
            // Calculate how far into the current section we are (0-1)
            const rawIndex = scrollY / windowHeight - 1;
            const index = Math.floor(rawIndex);
            scrollProgress = rawIndex - index;
            
            return {
                index: Math.min(Math.max(index, -1), links.length - 1),
                progress: scrollProgress
            };
        }
        
        // Modified scroll handler with looping
        function handleScroll() {
            // Get previous position to determine direction
            prevScrollY = scrollY;
            scrollY = window.scrollY;
            
            // Check if we've reached the bottom of the page
            if (scrollY + window.innerHeight >= document.body.scrollHeight - 10) {
                // Loop back to the top (after the landing page)
                window.scrollTo(0, window.innerHeight);
                scrollY = window.innerHeight;
                prevScrollY = 0;
            }
            
            // Determine scroll direction
            scrollDirection = scrollY > prevScrollY ? 1 : (scrollY < prevScrollY ? -1 : 0);
            
            // Affect rotation speed based on scroll intensity
            const scrollDelta = Math.abs(scrollY - prevScrollY);
            if (scrollDelta > 10) {
                rotationSpeed = 2 + scrollDelta / 120; // Increase rotation speed during scroll
                rotationSpeedResetTime = 0;
                lastScrollTime = performance.now(); // Track when last scroll occurred
            }
            
            const { index } = updateScrollProgress();
            
            // Check if we're scrolling back to the landing page
            if (index === -1 && currentIndex >= 0) {
                // Hide current object when returning to landing page
                const currentObj = objects[currentIndex];
                currentObj.visible = true;
                
                // Animate object moving downward out of view
                animateObject(currentObj, 0.5, -5, 800, () => {
                    currentObj.visible = false;
                });
                
                // Reset current index to indicate we're on the landing page
                currentIndex = -1;
                return;
            }
            
            // Only change object if we've moved to a new section
            if (index >= 0 && index !== currentIndex) {
                targetIndex = index;
                showObject(targetIndex);
            }
            
            // Update current object position based on scroll progress
            if (currentIndex >= 0 && currentIndex < objects.length) {
                const obj = objects[currentIndex];
                if (obj.visible && !obj.userData.isAnimating) {
                    // Add subtle movement based on scroll position within section
                    const windowHeight = window.innerHeight;
                    const sectionScrollY = scrollY - (windowHeight * (currentIndex + 1));
                    const normalizedPosition = (sectionScrollY / windowHeight) * 0.5; // Range of movement
                    
                    // Small position adjustment based on scroll
                    obj.position.y = normalizedPosition;
                }
            }
        }
        
        // Variables for rotation axis based on mouse position
        let rotationAxis = new THREE.Vector3(1, 1, 1).normalize();
        let targetRotationAxis = new THREE.Vector3(1, 1, 1).normalize();
        
        // Mouse movement handler with water ripple effect and rotation axis update
        function handleMouseMove(event) {
            const prevMouseX = mouseX;
            const prevMouseY = mouseY;
            
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            
            mouse.x = mouseX;
            mouse.y = mouseY;
            
            // Update the rotation axis based on mouse position
            // This creates a 3D vector pointing from center towards mouse position
            targetRotationAxis.set(mouseX, mouseY, 1).normalize();
            
            // Create water ripple effect (at a throttled rate)
            if (!lastRippleTime || performance.now() - lastRippleTime > 100) {
                createRipple(event.clientX, event.clientY);
                lastRippleTime = performance.now();
            }
        }
        
        // Click handler
        function handleClick() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);
            
            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (object.userData.isLink && object.scale.x > 0.5) {
                    window.open(object.userData.url, '_blank');
                }
            }
        }
        
        // Variables for rotation animation
        let rotationSpeed = 0.5;
        let defaultRotationSpeed = 0.5; // Store the default rotation speed
        let rotationSpeedResetTime = 0;
        let lastRippleTime = 0;
        let lastScrollTime = 0; // Track when the last scroll event occurred
        
        // Enhanced animation loop with mouse-based rotation axis
        function animate() {
            const currentTime = performance.now();
            requestAnimationFrame(animate);
            
            // Extra debug for STL visibility
            if (currentIndex === 0 && objects.length > 0) {
                const obj = objects[0];
                if (obj && !obj.debugLogged) {
                    console.log('STL object in view:', 
                                'visible=', obj.visible, 
                                'position=', obj.position.y,
                                'scale=', obj.scale.x);
                    obj.debugLogged = true;
                }
            }
            
            targetX = mouseX * 0.3;
            targetY = mouseY * 0.3;
            
            // More subtle, controlled 3D mouse interactions with models
            if (currentIndex >= 0 && currentIndex < objects.length) {
                const obj = objects[currentIndex];
                if (obj.visible && !obj.userData.isAnimating) {
                    // Add only subtle tilt based on mouse position
                    obj.rotation.y = targetX * 0.3;
                    obj.rotation.x = targetY * -4.0;
                }
            }
            
            // Handle hover effects
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);
            
            document.body.style.cursor = 'default';
            
            if (hoveredObject) {
                linkNameElement.style.opacity = '0';
                hoveredObject.material.emissive.set(0x000000);
                hoveredObject = null;
            }
            
            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (object.userData.isLink && object.visible && object.scale.x > 0.5) {
                    document.body.style.cursor = 'pointer';
                    object.material.emissive.set(0x333333);
                    linkNameElement.textContent = object.userData.text;
                    linkNameElement.style.opacity = '1';
                    hoveredObject = object;
                }
            }
            
            // Smoothly update the rotation axis
            rotationAxis.lerp(targetRotationAxis, 0.03);
            
            // Gradually reduce rotation speed over time if no scroll activity
            if (lastScrollTime > 0 && currentTime - lastScrollTime > 300) { // Check if it's been 300ms since last scroll
                // Calculate how much to decrease the speed based on time since last scroll
                const decreaseFactor = Math.min(1, (currentTime - lastScrollTime) / 2000); // Takes 2 seconds to fully slow down
                
                // Interpolate between current speed and default speed
                rotationSpeed = rotationSpeed - (rotationSpeed - defaultRotationSpeed) * decreaseFactor * 0.05;
                
                // If we're very close to default speed, just set it
                if (Math.abs(rotationSpeed - defaultRotationSpeed) < 0.05) {
                    rotationSpeed = defaultRotationSpeed;
                }
            }
            
            // Rotate particles around axis determined by mouse position
            const rotationAngle = 0.005 * rotationSpeed;
            
            // Apply quaternion rotation around the dynamic axis
            const quaternion = new THREE.Quaternion();
            quaternion.setFromAxisAngle(rotationAxis, rotationAngle);
            particles.quaternion.multiply(quaternion);
            
            // Scene subtle rotation based on mouse - smoother with lerping
            scene.rotation.x += (targetY * 0.05 - scene.rotation.x) * 0.01;
            scene.rotation.y += (targetX * 0.05 - scene.rotation.y) * 0.01;
            
            // Draw water ripples
            drawRipples();
            
            renderer.render(scene, camera);
        }
        
   
        
        // Window resize handler with ripple canvas update
        function handleResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // Resize ripple canvas
            rippleCanvas.width = window.innerWidth;
            rippleCanvas.height = window.innerHeight;
        }
        
        // Handle touch events for mobile with ripple effect and rotation
        function handleTouchMove(event) {
            if (event.touches.length > 0) {
                mouseX = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouseY = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
                
                mouse.x = mouseX;
                mouse.y = mouseY;
                
                // Update rotation axis for touch events too
                targetRotationAxis.set(mouseX, mouseY, 1).normalize();
                
                // Create water ripple effect for touch
                if (!lastRippleTime || performance.now() - lastRippleTime > 100) {
                    createRipple(event.touches[0].clientX, event.touches[0].clientY);
                    lastRippleTime = performance.now();
                }
            }
        }
        
        // Event listeners
        window.addEventListener('scroll', handleScroll);
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('click', handleClick);
        window.addEventListener('touchmove', handleTouchMove);
        window.addEventListener('touchstart', handleTouchMove);
        window.addEventListener('resize', handleResize);
        
        // Initialize
        handleScroll();
        animate();
        
        // Enhanced lighting to better show the white model
        // Add a new spotlight aimed directly at the center
        const spotLight = new THREE.SpotLight(0xffffff, 1.5);
        spotLight.position.set(0, 5, 10);
        spotLight.angle = Math.PI / 6;
        spotLight.penumbra = 0.2;
        spotLight.decay = 0;
        spotLight.distance = 0;
        spotLight.target.position.set(0, 0, 0);
        scene.add(spotLight);
        scene.add(spotLight.target);
        
        // Enhanced lighting specifically for better detail visibility
        // Add a key light from one side
        const keyLight = new THREE.DirectionalLight(0xFFFFFF, 1.5);
        keyLight.position.set(5, 5, 5);
        scene.add(keyLight);
        
        // Add a fill light from the opposite side (softer)
        const fillLight = new THREE.DirectionalLight(0xFFFFFF, 0.7);
        fillLight.position.set(-5, 3, 5);
        scene.add(fillLight);
        
        // Add a rim light from behind to highlight edges
        const rimLight = new THREE.DirectionalLight(0xFFFFFF, 0.8);
        rimLight.position.set(0, -5, -5);
        scene.add(rimLight);
        
        // Add a rotation debug helper function
        window.rotateModel = function(x, y, z) {
            if (objects.length > 0) {
                const obj = objects[0];
                // Apply fixed rotation (no animation)
                if (x !== undefined) obj.rotation.x = x;
                if (y !== undefined) obj.rotation.y = y;
                if (z !== undefined) obj.rotation.z = z;
                
                // Update initial rotation
                obj.userData.initialRotation = {
                    x: obj.rotation.x,
                    y: obj.rotation.y,
                    z: obj.rotation.z
                };
                
                console.log('Fixed rotation set:', obj.rotation);
                return obj.rotation;
            }
            return null;
        };
    </script>
</body>
