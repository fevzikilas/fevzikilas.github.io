<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fevzi kilas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --nav-height: 60px;
            --bg: #000;
            --panel: rgba(0, 0, 0, 0.85);
            --text: #fff;
            --muted: rgba(255, 255, 255, 0.70);
            --border: rgba(255, 255, 255, 0.16);
            --iframe-scale: 1;

            --nav-bg: var(--panel);
            --nav-border: var(--border);
            --nav-item-bg: transparent;
            --nav-item-border: rgba(255, 255, 255, 0.18);
            --nav-item-hover-bg: rgba(255, 255, 255, 0.06);
            --nav-item-active-bg: rgba(255, 255, 255, 0.12);
            --nav-item-active-border: rgba(255, 255, 255, 0.50);
        }

        body {
            margin: 0;
            font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
        }

        nav {
            height: var(--nav-height);
            width: calc(100% - 24px);
            max-width: 1800px;
            margin: 12px auto;
            border: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            z-index: 10;
            padding: 0;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 12px;
            right: 12px;
            background: transparent;
        }

        #nav-scroll-right {
            height: 40px;
            width: 40px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: transparent;
            color: var(--text);
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            padding: 0;
            font: inherit;
            line-height: 1;
        }

        #nav-scroll-right:hover { background: rgba(255, 255, 255, 0.06); }

        #nav-scroll-right:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.65);
            outline-offset: 2px;
        }
        
        #sheet-list {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: row;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0;
            height: 100%;
            gap: 8px;
            align-items: center;

            scrollbar-width: none;
        }

        #sheet-list::-webkit-scrollbar { height: 0px; }
        #sheet-list::-webkit-scrollbar-track { background: transparent; }
        #sheet-list::-webkit-scrollbar-thumb { background: transparent; }
        #sheet-list::-webkit-scrollbar-corner { background: transparent; }

        .sheet-item {
            padding: 10px 12px;
            margin: 0;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            color: var(--text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background: var(--nav-item-bg);
            border: 1px solid var(--nav-item-border);
            border-radius: 10px;
            user-select: none;
            text-align: center;
            appearance: none;

            /* ensure Fira Code on sheet buttons */
            font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        }

        .sheet-item:hover { background: var(--nav-item-hover-bg); }

        .sheet-item.active {
            background: var(--nav-item-active-bg);
            border-color: var(--nav-item-active-border);
        }

        .sheet-item:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.65);
            outline-offset: 2px;
        }

        main {
            flex: 1;
            background: var(--bg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-top: calc(var(--nav-height) + 24px);
        }

        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 0;
            overflow: hidden; 
        }

        .iframe-container.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 1;
        }

        iframe {
            width: calc(100% / var(--iframe-scale));
            height: calc(100% / var(--iframe-scale));
            border: none;
            display: block;
            transform: scale(var(--iframe-scale));
            transform-origin: 0 0;
            background: #fff;
            filter: invert(1) hue-rotate(180deg);
            will-change: transform;
        }
        
        .status-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--muted);
            z-index: 100;
            pointer-events: none;
        }

        .error-box {
            margin: 20px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 8px;
            color: var(--text);
            text-align: left;
            z-index: 100;
            position: relative;
        }
        
        .error-title {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }

    </style>
</head>
<body>

<nav>
    <div id="sheet-list"></div>

    <button id="nav-scroll-right" type="button" aria-label="Scroll tabs right">›</button>
</nav>

<main id="main-area">
    <div id="loading-msg" class="status-msg">Initializing...</div>
</main>

<script>
    const CONFIG = {
        apiKey: "AIzaSyBzVqt9DxS4BxteZnIbQLHDbytnw5nJVCQ",
        // Ordered list: 1, then 2, then 3
        spreadsheets: [
            {
                spreadsheetId: "1_O3TO0W9DLGGqslIMG3NZCqdSOMk0W-7FpIabfg03fA",
                publishedId: "2PACX-1vRwtMFlNrApnyn6n75k093SRTbZA-SV73TvEe8aCfIfpOK8Irxwc8KRhdgQDTfaeD0M8zH2_jHFJ5_e"
            },
            {
                spreadsheetId: "1N6a6ZMXskLuUDPoyifJ7UKptWQLc2g5Ii_sxTHIjXOo",
                publishedId: "2PACX-1vRMvUOG2DzgNSNKGWEsmK3x_oYa4l6b6-Z3cB5oHZynAbjGHrclXP2TAJPE0GTu734oL2OkgdoItDtV"
            },
            {
                spreadsheetId: "1b36nfSjZxuu98ybgY5Y_2OMHhoyQDsODQR5YBZTUBGQ",
                publishedId: "2PACX-1vR2VU5y3XoqDtowVa4dJVSaa_cbvGB07ZNJNY1GkOP6LKAQOSljzqdxzctV6V-I-erlNpYYpCuPVXlZ"
            }
        ]
    };
/* 
   
   
   1:
   publishedId: "2PACX-1vRwtMFlNrApnyn6n75k093SRTbZA-SV73TvEe8aCfIfpOK8Irxwc8KRhdgQDTfaeD0M8zH2_jHFJ5_e" 
   spreadsheetId: "1_O3TO0W9DLGGqslIMG3NZCqdSOMk0W-7FpIabfg03fA"

   2:
   publishedId: "2PACX-1vRMvUOG2DzgNSNKGWEsmK3x_oYa4l6b6-Z3cB5oHZynAbjGHrclXP2TAJPE0GTu734oL2OkgdoItDtV"
   spreadsheetId: "1N6a6ZMXskLuUDPoyifJ7UKptWQLc2g5Ii_sxTHIjXOo"

   3:
   publishedId: "2PACX-1vR2VU5y3XoqDtowVa4dJVSaa_cbvGB07ZNJNY1GkOP6LKAQOSljzqdxzctV6V-I-erlNpYYpCuPVXlZ"
   spreadsheetId: "1b36nfSjZxuu98ybgY5Y_2OMHhoyQDsODQR5YBZTUBGQ"

*/
    const els = {
        sheetList: document.getElementById('sheet-list'),
        main: document.getElementById('main-area'),
        loadingMsg: document.getElementById('loading-msg'),
        scrollRight: document.getElementById('nav-scroll-right')
    };

    let sheets = [];
    let activeSheetId = null;
    const loadedSheets = new Set();
    const sheetIndex = new Map(); // compositeId -> metadata

    async function init() {
        setupNavScroll();
        updateIframeScale();

        try {
            await fetchAllMetadata();
        } catch (err) {
            showError("Initialization Failed", err.message);
        }
    }

    function updateIframeScale() {
        const container = els.main;
        if (!container) return;

        const rect = container.getBoundingClientRect();
        const w = rect.width || window.innerWidth || 0;
        const h = rect.height || (window.innerHeight - (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav-height')) || 60)) || 0;

        // Base content size to target (keeps sheets readable while scaling down on small screens)
        const BASE_W = 1600; // px
        const BASE_H = 900;  // px

        let s = Math.min(w / BASE_W, h / BASE_H);
        if (!isFinite(s) || s <= 0) s = 1;
        // Clamp to avoid over-scaling and extreme downscales
        s = Math.min(Math.max(s, 0.5), 1);
        // Round to 2 decimals to reduce layout thrash on continuous resize
        s = Math.round(s * 100) / 100;

        document.documentElement.style.setProperty('--iframe-scale', String(s));
    }

    async function fetchAllMetadata() {
        sheets = [];
        sheetIndex.clear();
        const failures = [];

        for (let i = 0; i < CONFIG.spreadsheets.length; i++) {
            const sp = CONFIG.spreadsheets[i];
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${sp.spreadsheetId}?fields=properties.title,sheets.properties(title,sheetId)&key=${CONFIG.apiKey}`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    let msg = `API Error: ${response.status}`;
                    try {
                        const err = await response.json();
                        msg = err.error?.message || msg;
                    } catch {}
                    throw new Error(msg);
                }

                const data = await response.json();
                const spreadsheetTitle = (data.properties && data.properties.title) || "";

                (data.sheets || []).forEach(s => {
                    const gid = s.properties.sheetId;
                    const compositeId = `${i}:${gid}`; // unique across all spreadsheets
                    const entry = {
                        title: s.properties.title,
                        id: compositeId,
                        gid,
                        publishedId: sp.publishedId,
                        spreadsheetId: sp.spreadsheetId,
                        spreadsheetTitle
                    };
                    sheets.push(entry);
                    sheetIndex.set(compositeId, entry);
                });
            } catch (error) {
                console.warn("Sheets API failed; falling back to published HTML for index", i, error);
                try {
                    const pub = await fetchSheetListFromPublished(sp.publishedId);
                    const spreadsheetTitle = pub.title || `Spreadsheet ${i + 1}`;
                    pub.sheets.forEach(s => {
                        const gid = s.gid;
                        const compositeId = `${i}:${gid}`;
                        const entry = {
                            title: s.title,
                            id: compositeId,
                            gid,
                            publishedId: sp.publishedId,
                            spreadsheetId: sp.spreadsheetId,
                            spreadsheetTitle
                        };
                        sheets.push(entry);
                        sheetIndex.set(compositeId, entry);
                    });
                } catch (fallbackErr) {
                    console.error("Published HTML fallback failed for index", i, fallbackErr);
                    failures.push({ index: i, error: fallbackErr });
                }
            }
        }

        if (sheets.length === 0) {
            const msg = failures[0]?.error?.message || "No sheets found.";
            throw new Error(msg);
        }

        renderNavbar();
        activateSheet(sheets[0].id);
        setTimeout(preloadAllSheets, 2000);
    }

    async function fetchSheetListFromPublished(publishedId) {
        const url = `https://docs.google.com/spreadsheets/d/e/${publishedId}/pubhtml?widget=true&chrome=true`;
        const res = await fetch(url, { credentials: 'omit' });
        if (!res.ok) throw new Error(`Published fetch error: ${res.status}`);
        const html = await res.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const title = (doc.querySelector('title')?.textContent || '').trim();

        const items = [];
        const anchors = Array.from(doc.querySelectorAll('a[href*="gid="]'));
        const seen = new Set();
        anchors.forEach(a => {
            const href = a.getAttribute('href') || '';
            const m = href.match(/gid=(\d+)/);
            if (!m) return;
            const gid = Number(m[1]);
            if (!Number.isFinite(gid)) return;
            if (seen.has(gid)) return;
            const text = (a.textContent || '').trim();
            if (!text) return;
            seen.add(gid);
            items.push({ gid, title: text });
        });

        // Fallback regex if DOM structure changes
        if (items.length === 0) {
            const regex = /<a[^>]+href=\"[^\"]*gid=(\d+)\"[^>]*>([^<]+)<\/a>/gi;
            const seen2 = new Set();
            let match;
            while ((match = regex.exec(html)) !== null) {
                const gid = Number(match[1]);
                const text = (match[2] || '').trim();
                if (!Number.isFinite(gid) || !text || seen2.has(gid)) continue;
                seen2.add(gid);
                items.push({ gid, title: text });
            }
        }

        if (items.length === 0) throw new Error('Could not parse published sheet list.');
        return { title, sheets: items };
    }

    function renderNavbar() {
        els.sheetList.innerHTML = '';
        
        sheets.forEach(sheet => {
            const item = document.createElement('button');
            item.className = 'sheet-item';
            item.type = 'button';
            item.textContent = sheet.title;
            item.dataset.id = sheet.id;
            item.onclick = () => activateSheet(sheet.id);
            els.sheetList.appendChild(item);
        });

        updateScrollArrow();
    }

    function activateSheet(id) {
        if (activeSheetId === id) return;
        
        activeSheetId = id;
        document.querySelectorAll('.sheet-item').forEach(el => {
            const isActive = el.dataset.id == id;
            el.classList.toggle('active', isActive);
            if (isActive) el.scrollIntoView({ behavior: 'smooth', inline: 'center' });
        });

        ensureIframe(id);

        document.querySelectorAll('.iframe-container').forEach(el => {
            el.classList.toggle('active', el.dataset.id == id);
        });

        els.loadingMsg.style.display = 'none';

        updateScrollArrow();
        updateIframeScale();
    }

    function updateScrollArrow() {
        const el = els.sheetList;
        const btn = els.scrollRight;
        if (!el || !btn) return;

        const hasOverflow = el.scrollWidth > el.clientWidth + 1;
        const remaining = el.scrollWidth - el.clientWidth - el.scrollLeft;
        const show = hasOverflow && remaining > 2;
        btn.style.display = show ? 'inline-flex' : 'none';
    }

    function setupNavScroll() {
        if (!els.sheetList || !els.scrollRight) return;

        els.scrollRight.addEventListener('click', () => {
            const amount = Math.max(240, Math.floor(els.sheetList.clientWidth * 0.8));
            els.sheetList.scrollBy({ left: amount, behavior: 'smooth' });
        });

        els.sheetList.addEventListener('scroll', () => {
            updateScrollArrow();
        }, { passive: true });

        window.addEventListener('resize', () => {
            updateScrollArrow();
            updateIframeScale();
        });
    }

    function ensureIframe(id) {
        if (loadedSheets.has(id)) return;

        const meta = sheetIndex.get(id);
        if (!meta) return;

        const container = document.createElement('div');
        container.className = 'iframe-container';
        container.dataset.id = id;

        const src = `https://docs.google.com/spreadsheets/d/e/${meta.publishedId}/pubhtml?gid=${meta.gid}&single=true&widget=false&headers=false&chrome=false&gridlines=false`;
        
        const iframe = document.createElement('iframe');
        iframe.setAttribute('loading', 'lazy');
        iframe.src = src;
        
        container.appendChild(iframe);
        els.main.appendChild(container);
        
        loadedSheets.add(id);
    }

    function preloadAllSheets() {
        console.log("Starting preload...");
        let delay = 0;
        
        sheets.forEach(sheet => {
            if (!loadedSheets.has(sheet.id)) {
                setTimeout(() => {
                    ensureIframe(sheet.id);
                }, delay);
                delay += 500;
            }
        });
    }

    function showError(title, message) {
        els.main.innerHTML = `
            <div class="error-box">
                <span class="error-title">${title}</span>
                <div>${message}</div>
            </div>
        `;
    }

    init();

</script>
</body>
</html>
