<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fevzi kilas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --nav-height: 60px;
            --bg: #000;
            --panel: rgba(0, 0, 0, 0.85);
            --text: #fff;
            --muted: rgba(255, 255, 255, 0.70);
            --border: rgba(255, 255, 255, 0.16);

            /* minimal dark scrollbar palette */
            --scrollbar-track: rgba(255, 255, 255, 0.06);
            --scrollbar-thumb: rgba(255, 255, 255, 0.28);
            --scrollbar-thumb-hover: rgba(255, 255, 255, 0.42);

            --nav-bg: var(--panel);
            --nav-border: var(--border);
            --nav-item-bg: transparent;
            --nav-item-border: rgba(255, 255, 255, 0.18);
            --nav-item-hover-bg: rgba(255, 255, 255, 0.06);
            --nav-item-active-bg: rgba(255, 255, 255, 0.12);
            --nav-item-active-border: rgba(255, 255, 255, 0.50);
        }

        body {
            margin: 0;
            font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
        }

        nav {
            height: var(--nav-height);
            width: calc(100% - 24px);
            max-width: 1800px;
            margin: 12px auto;
            border: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            z-index: 10;
            padding: 0;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 12px;
            right: 12px;
            background: transparent;
        }

        #nav-scroll-right {
            height: 40px;
            width: 40px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: transparent;
            color: var(--text);
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            padding: 0;
            font: inherit;
            line-height: 1;
        }

        #nav-scroll-right:hover { background: rgba(255, 255, 255, 0.06); }

        #nav-scroll-right:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.65);
            outline-offset: 2px;
        }
        
        #sheet-list {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: row;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0;
            height: 100%;
            gap: 8px;
            align-items: center;

            scrollbar-width: none;
        }

        #sheet-list::-webkit-scrollbar { height: 0px; }
        #sheet-list::-webkit-scrollbar-track { background: transparent; }
        #sheet-list::-webkit-scrollbar-thumb { background: transparent; }
        #sheet-list::-webkit-scrollbar-corner { background: transparent; }

        .sheet-item {
            padding: 10px 12px;
            margin: 0;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            color: var(--text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background: var(--nav-item-bg);
            border: 1px solid var(--nav-item-border);
            border-radius: 10px;
            user-select: none;
            text-align: center;
            appearance: none;

            /* ensure Fira Code on sheet buttons */
            font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        }

        .sheet-item:hover { background: var(--nav-item-hover-bg); }

        .sheet-item.active {
            background: var(--nav-item-active-bg);
            border-color: var(--nav-item-active-border);
        }

        .sheet-item:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.65);
            outline-offset: 2px;
        }

        main {
            flex: 1;
            background: var(--bg);
            position: relative;
            /* remove outer scrollbars; let iframe handle scrolling */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-top: calc(var(--nav-height) + 24px);
        }

        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 0;
            /* remove outer scrollbars; only the iframe's inner scrolling visible */
            overflow: hidden; 
        }

        .iframe-container.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #fff;
            filter: invert(1) hue-rotate(180deg);
        }

        /* Outer scrollbar styling removed to avoid double scrollbars */
        
        .status-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--muted);
            z-index: 100;
            pointer-events: none;
        }

        .error-box {
            margin: 20px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 8px;
            color: var(--text);
            text-align: left;
            z-index: 100;
            position: relative;
        }
        
        .error-title {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }

    </style>
</head>
<body>

<nav>
    <div id="sheet-list"></div>

    <button id="nav-scroll-right" type="button" aria-label="Scroll tabs right">›</button>
</nav>

<main id="main-area">
    <div id="loading-msg" class="status-msg">Initializing...</div>
</main>

<script>
    const CONFIG = {
        spreadsheetId: "1_O3TO0W9DLGGqslIMG3NZCqdSOMk0W-7FpIabfg03fA",
        apiKey: "AIzaSyBzVqt9DxS4BxteZnIbQLHDbytnw5nJVCQ",
        publishedId: "2PACX-1vRwtMFlNrApnyn6n75k093SRTbZA-SV73TvEe8aCfIfpOK8Irxwc8KRhdgQDTfaeD0M8zH2_jHFJ5_e" 
    };

    const els = {
        sheetList: document.getElementById('sheet-list'),
        main: document.getElementById('main-area'),
        loadingMsg: document.getElementById('loading-msg'),
        scrollRight: document.getElementById('nav-scroll-right')
    };

    let sheets = [];
    let activeSheetId = null;
    const loadedSheets = new Set();

    async function init() {
        setupNavScroll();

        if (CONFIG.publishedId === "YOUR_PUBLISHED_ID_HERE") {
            showError("Configuration Required", "Please update the publishedId.");
            return;
        }

        try {
            await fetchMetadata();
        } catch (err) {
            showError("Initialization Failed", err.message);
        }
    }

    async function fetchMetadata() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.spreadsheetId}?fields=properties.title,sheets.properties(title,sheetId)&key=${CONFIG.apiKey}`;
        
        try {
            const response = await fetch(url);
            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error?.message || `API Error: ${response.status}`);
            }
            
            const data = await response.json();

            sheets = (data.sheets || []).map(s => ({
                title: s.properties.title,
                id: s.properties.sheetId
            }));

            if (sheets.length === 0) throw new Error("No sheets found.");

            renderNavbar();
            
            activateSheet(sheets[0].id);
            
            setTimeout(preloadAllSheets, 2000);

        } catch (error) {
            console.error(error);
            showError("Error", error.message);
        }
    }

    function renderNavbar() {
        els.sheetList.innerHTML = '';
        
        sheets.forEach(sheet => {
            const item = document.createElement('button');
            item.className = 'sheet-item';
            item.type = 'button';
            item.textContent = sheet.title;
            item.dataset.id = sheet.id;
            item.onclick = () => activateSheet(sheet.id);
            els.sheetList.appendChild(item);
        });

        updateScrollArrow();
    }

    function activateSheet(gid) {
        if (activeSheetId === gid) return;
        
        activeSheetId = gid;
        document.querySelectorAll('.sheet-item').forEach(el => {
            const isActive = el.dataset.id == gid;
            el.classList.toggle('active', isActive);
            if (isActive) el.scrollIntoView({ behavior: 'smooth', inline: 'center' });
        });

        ensureIframe(gid);

        document.querySelectorAll('.iframe-container').forEach(el => {
            el.classList.toggle('active', el.dataset.id == gid);
        });

        els.loadingMsg.style.display = 'none';

        updateScrollArrow();
    }

    function updateScrollArrow() {
        const el = els.sheetList;
        const btn = els.scrollRight;
        if (!el || !btn) return;

        const hasOverflow = el.scrollWidth > el.clientWidth + 1;
        const remaining = el.scrollWidth - el.clientWidth - el.scrollLeft;
        const show = hasOverflow && remaining > 2;
        btn.style.display = show ? 'inline-flex' : 'none';
    }

    function setupNavScroll() {
        if (!els.sheetList || !els.scrollRight) return;

        els.scrollRight.addEventListener('click', () => {
            const amount = Math.max(240, Math.floor(els.sheetList.clientWidth * 0.8));
            els.sheetList.scrollBy({ left: amount, behavior: 'smooth' });
        });

        els.sheetList.addEventListener('scroll', () => {
            updateScrollArrow();
        }, { passive: true });

        window.addEventListener('resize', () => {
            updateScrollArrow();
        });
    }

    function ensureIframe(gid) {
        if (loadedSheets.has(gid)) return;

        const container = document.createElement('div');
        container.className = 'iframe-container';
        container.dataset.id = gid;

        const src = `https://docs.google.com/spreadsheets/d/e/${CONFIG.publishedId}/pubhtml?gid=${gid}&single=true&widget=false&headers=false&chrome=false&gridlines=false`;
        
        const iframe = document.createElement('iframe');
        iframe.setAttribute('loading', 'lazy');
        iframe.src = src;
        
        container.appendChild(iframe);
        els.main.appendChild(container);
        
        loadedSheets.add(gid);
    }

    function preloadAllSheets() {
        console.log("Starting preload...");
        let delay = 0;
        
        sheets.forEach(sheet => {
            if (!loadedSheets.has(sheet.id)) {
                setTimeout(() => {
                    ensureIframe(sheet.id);
                }, delay);
                delay += 500;
            }
        });
    }

    function showError(title, message) {
        els.main.innerHTML = `
            <div class="error-box">
                <span class="error-title">${title}</span>
                <div>${message}</div>
            </div>
        `;
    }

    init();

</script>
</body>
</html>
